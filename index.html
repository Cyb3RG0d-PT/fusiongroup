<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Manager APP's - FusionGroup</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff; }
        .hero {
            background-image: url('fundo.jpg');
            min-height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 17, 23, 0.85); }
        .content { position: relative; z-index: 2; max-width: 1000px; width: 100%; }
        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #d946ef 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { font-size: clamp(1rem, 2vw, 1.2rem); color: #cbd5e1; font-weight: 300; margin-bottom: 25px; }
        
        .site-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-filter-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 9px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .tab-filter-btn:hover { background: rgba(51, 65, 85, 0.9); color: #fff; }
        .tab-filter-btn.active { background: #d946ef; color: #fff; border-color: #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.5); }

        .program-section { margin-bottom: 35px; text-align: left; }
        .program-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #818cf8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .plan-card {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 22px;
            backdrop-filter: blur(6px);
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }
        .plan-card:hover { transform: translateY(-3px); border-color: rgba(217, 70, 239, 0.4); }
        .plan-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 12px; color: #fff; }
        .plan-price { font-size: 1.45rem; color: #34d399; font-weight: bold; }
        .plan-discount { font-size: 0.95rem; color: #f472b6; text-decoration: line-through; margin-left: 8px; }
        
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            background: linear-gradient(135deg, #d946ef 0%, #818cf8 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        .download-btn:hover { opacity: 0.9; }

        .promo-tag {
            position: absolute;
            top: 15px; right: 15px;
            background: #f472b6; color: #0f1723;
            font-size: 10px; font-weight: bold;
            padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
        }
        .stock-tag {
            font-size: 11px;
            color: #f472b6;
            margin-top: 10px;
            font-weight: bold;
            display: block;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="overlay"></div>
        <div class="content">
            <h1 id="siteTitle">Social Manager APP's - FusionGroup</h1>
            <p id="siteSubtitle">A carregar...</p>

            <div id="filterTabs" class="site-tabs" style="display: none;"></div>

            <div id="plansContainer"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://scriptview.fusiongroup.pt/api/public-info';
        let cachedPlans = [];

        async function loadServerData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                if (data.success) {
                    let settings = data.settings || {};

                    if (settings.site_maintenance === 'true' || settings.site_maintenance === true) {
                        document.getElementById('siteTitle').innerText = "Projecto em Manutenção";
                        document.getElementById('siteSubtitle').innerText = "Aguardem Novidades";
                        document.getElementById('filterTabs').style.display = 'none';
                        document.getElementById('plansContainer').style.display = 'none';
                        document.getElementById('plansContainer').innerHTML = '';
                        return;
                    }

                    document.getElementById('siteTitle').innerText = "Social Manager APP's - FusionGroup";
                    document.getElementById('siteSubtitle').innerText = "Planos & Promoções Oficiais";
                    
                    cachedPlans = data.plans || [];
                    
                    generateDynamicTabs(cachedPlans);
                    renderPlansGrouped(cachedPlans);
                }
            } catch (error) {
                console.error("Erro ao ligar ao servidor:", error);
                document.getElementById('siteSubtitle').innerText = "Erro ao ligar ao servidor de gestão.";
            }
        }

        function generateDynamicTabs(plans) {
            let tabsContainer = document.getElementById('filterTabs');
            tabsContainer.style.display = 'flex';
            
            let uniquePrograms = [...new Set(plans.map(p => p.program || 'Geral'))].filter(Boolean);

            let html = `<button class="tab-filter-btn active" onclick="filterPlans('all', event)">Todos os Planos</button>`;
            
            uniquePrograms.forEach(prog => {
                let icon = prog.toLowerCase().includes('social') ? '📱' : (prog.toLowerCase().includes('lightburn') ? '🔥' : '💻');
                html += `<button class="tab-filter-btn" onclick="filterPlans('${prog}', event)">${icon} ${prog}</button>`;
            });

            html += `<button class="tab-filter-btn" onclick="filterPlans('promo', event)">🔥 Promoções</button>`;
            html += `<button class="tab-filter-btn" onclick="filterPlans('downloads', event)">📥 Downloads</button>`;
            
            tabsContainer.innerHTML = html;
        }

        function renderPlansGrouped(plansToRender) {
            let container = document.getElementById('plansContainer');
            container.style.display = 'block';
            container.innerHTML = '';

            if (plansToRender.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 20px;">Nenhum plano disponível de momento.</p>';
                return;
            }

            let groups = {};
            plansToRender.forEach(plan => {
                let prog = plan.program || 'Geral';
                if (!groups[prog]) groups[prog] = [];
                groups[prog].push(plan);
            });

            Object.keys(groups).forEach(progName => {
                let section = document.createElement('div');
                section.className = 'program-section';

                let icon = progName.toLowerCase().includes('social') ? '📱' : (progName.toLowerCase().includes('lightburn') ? '🔥' : '💻');
                section.innerHTML = `<div class="program-title"><span>${icon}</span> ${progName}</div>`;

                let grid = document.createElement('div');
                grid.className = 'plans-grid';

                groups[progName].forEach(plan => {
                    let card = document.createElement('div');
                    card.className = 'plan-card';
                    
                    let hasPromo = plan.discount && plan.discount.trim() !== "";
                    let promoTagHtml = hasPromo ? `<div class="promo-tag">Promoção</div>` : '';
                    
                    let priceHtml = `<span class="plan-price">${plan.price}</span>`;
                    if (hasPromo) {
                        priceHtml = `<span class="plan-price">${plan.discount}</span> <span class="plan-discount">${plan.price}</span>`;
                    }

                    let stockHtml = '';
                    if (plan.stock_limit !== null && plan.stock_limit !== undefined) {
                        let restantes = plan.stock_limit - (plan.sales_count || 0);
                        stockHtml = `<div class="stock-tag">🔥 Stock Limitado: ${restantes} / ${plan.stock_limit} disponíveis</div>`;
                    }

                    card.innerHTML = `
                        ${promoTagHtml}
                        <div class="plan-title">${plan.name}</div>
                        <div>${priceHtml}</div>
                        ${stockHtml}
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function renderDownloadsView(plans) {
            let container = document.getElementById('plansContainer');
            container.style.display = 'block';
            container.innerHTML = '';

            let uniquePrograms = [...new Set(plans.map(p => p.program || 'Geral'))].filter(Boolean);

            let section = document.createElement('div');
            section.className = 'program-section';
            section.innerHTML = `<div class="program-title"><span>📥</span> Central de Downloads</div>`;

            let grid = document.createElement('div');
            grid.className = 'plans-grid';

            uniquePrograms.forEach(prog => {
                let icon = prog.toLowerCase().includes('social') ? '📱' : (prog.toLowerCase().includes('lightburn') ? '🔥' : '💻');
                let card = document.createElement('div');
                card.className = 'plan-card';

                // Nota: Se a API fornecer um link de download por programa (ex: plan.download_url), pode trocá-lo aqui.
                // Coloquei um link de exemplo que pode alterar para os seus instaladores.
                let downloadLink = "#"; 
                if (prog.toLowerCase().includes('lightburn')) {
                    downloadLink = "https://fusiongroup.pt/downloads/lightburn-fusion.zip";
                } else if (prog.toLowerCase().includes('social')) {
                    downloadLink = "https://fusiongroup.pt/downloads/social-manager.zip";
                }

                card.innerHTML = `
                    <div class="plan-title">${icon} ${prog}</div>
                    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">Descarregue a versão mais recente e estável do software.</p>
                    <a href="${downloadLink}" class="download-btn" target="_blank">📥 Descarregar Software</a>
                `;
                grid.appendChild(card);
            });

            section.appendChild(grid);
            container.appendChild(section);
        }

        function filterPlans(type, event) {
            document.querySelectorAll('.tab-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            if (type === 'all') {
                renderPlansGrouped(cachedPlans);
            } else if (type === 'promo') {
                let filtered = cachedPlans.filter(p => p.discount && p.discount.trim() !== "");
                renderPlansGrouped(filtered);
            } else if (type === 'downloads') {
                renderDownloadsView(cachedPlans);
            } else {
                let filtered = cachedPlans.filter(p => (p.program || '') === type);
                renderPlansGrouped(filtered);
            }
        }

        loadServerData();
    </script>
</body>
</html>
