<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Group - Em Manutenção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        .hero {
            /* Certifica-te que o nome aqui coincide exatamente com o nome do ficheiro no GitHub */
            background-image: url('fundo.jpg');
            height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Camada escura semitransparente para dar destaque ao texto sobre a imagem */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 17, 23, 0.65);
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #d946ef 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            letter-spacing: 4px;
            color: #cbd5e1;
            font-weight: 300;
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #d946ef;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px #d946ef;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="overlay"></div>
        <div class="content">
            <h1>Projecto em Manutenção</h1>
            <p><span class="status-dot"></span>Aguardem Novidades</p>
        </div>
    </div>

</body>
</html>
