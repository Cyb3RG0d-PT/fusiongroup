<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Group - Promoções e Licenças</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff; }
        .hero {
            background-image: url('fundo.jpg');
            min-height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 17, 23, 0.80); }
        .content { position: relative; z-index: 2; max-width: 900px; width: 100%; }
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #d946ef 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { font-size: clamp(1rem, 2vw, 1.2rem); color: #cbd5e1; font-weight: 300; margin-bottom: 20px; }
        
        .site-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tab-filter-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .tab-filter-btn:hover { background: rgba(51, 65, 85, 0.9); color: #fff; }
        .tab-filter-btn.active { background: #d946ef; color: #fff; border-color: #d946ef; box-shadow: 0 0 10px rgba(217, 70, 239, 0.4); }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
            text-align: left;
        }
        .plan-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(5px);
            position: relative;
        }
        .plan-program { font-size: 11px; color: #818cf8; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .plan-title { font-size: 1.2rem; font-weight: bold; margin: 8px 0; color: #fff; }
        .plan-price { font-size: 1.4rem; color: #34d399; font-weight: bold; }
        .plan-discount { font-size: 0.9rem; color: #f472b6; text-decoration: line-through; margin-left: 8px; }
        .promo-tag {
            position: absolute;
            top: 15px; right: 15px;
            background: #f472b6; color: #0f1723;
            font-size: 10px; font-weight: bold;
            padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="overlay"></div>
        <div class="content">
            <h1 id="siteTitle">FUSION GROUP</h1>
            <p id="siteSubtitle">A carregar...</p>

            <div id="filterTabs" class="site-tabs" style="display: none;">
                <button class="tab-filter-btn active" onclick="filterPlans('all', event)">Todos os Planos</button>
                <button class="tab-filter-btn" onclick="filterPlans('promo', event)">🔥 Destaques / Promoções</button>
            </div>

            <div id="plansContainer" class="plans-grid"></div>
        </div>
    </div>

    <script>
        // URL correto atualizado para o teu domínio scriptview
        const API_URL = 'https://scriptview.fusiongroup.pt/api/public-info';
        let cachedPlans = [];

        async function loadServerData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                if (data.success) {
                    let settings = data.settings || {};

                    // Se o modo manutenção estiver ativo
                    if (settings.site_maintenance === 'true' || settings.site_maintenance === true) {
                        document.getElementById('siteTitle').innerText = settings.site_title || "FUSION GROUP";
                        document.getElementById('siteSubtitle').innerText = settings.site_subtitle || "Servidor em atualização. Volte em breve!";
                        document.getElementById('filterTabs').style.display = 'none';
                        document.getElementById('plansContainer').style.display = 'none';
                        document.getElementById('plansContainer').innerHTML = '';
                        return;
                    }

                    // Modo Normal
                    document.getElementById('siteTitle').innerText = settings.site_title || "Fusion Group";
                    document.getElementById('siteSubtitle').innerText = settings.site_subtitle || "Planos & Promoções Oficiais";
                    document.getElementById('filterTabs').style.display = 'flex';
                    
                    cachedPlans = data.plans || [];
                    renderPlans(cachedPlans);
                }
            } catch (error) {
                console.error("Erro ao ligar ao servidor:", error);
                document.getElementById('siteSubtitle').innerText = "Erro ao ligar ao servidor de gestão.";
            }
        }

        function renderPlans(plansToRender) {
            let container = document.getElementById('plansContainer');
            container.style.display = 'grid';
            container.innerHTML = '';

            if (plansToRender.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Nenhum plano disponível de momento.</p>';
                return;
            }

            plansToRender.forEach(plan => {
                let card = document.createElement('div');
                card.className = 'plan-card';
                
                let hasPromo = plan.discount && plan.discount.trim() !== "";
                let promoTagHtml = hasPromo ? `<div class="promo-tag">Promoção</div>` : '';
                
                let priceHtml = `<span class="plan-price">${plan.price}</span>`;
                if (hasPromo) {
                    priceHtml = `<span class="plan-price">${plan.discount}</span> <span class="plan-discount">${plan.price}</span>`;
                }

                card.innerHTML = `
                    ${promoTagHtml}
                    <div class="plan-program">${plan.program || 'Geral'}</div>
                    <div class="plan-title">${plan.name}</div>
                    <div>${priceHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterPlans(type, event) {
            document.querySelectorAll('.tab-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            if (type === 'promo') {
                let promoPlans = cachedPlans.filter(p => p.discount && p.discount.trim() !== "");
                renderPlans(promoPlans);
            } else {
                renderPlans(cachedPlans);
            }
        }

        loadServerData();
    </script>
</body>
</html>
