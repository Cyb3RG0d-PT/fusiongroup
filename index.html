<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Manager APP's - FusionGroup</title>
    <!-- Favicon ligado diretamente ao teu servidor Flask -->
    <link rel="icon" type="image/png" href="https://scriptview.fusiongroup.pt/static/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff; }
        .hero {
            background-image: url('fundo.jpg');
            min-height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 17, 23, 0.85); z-index: 1; }
        .content { position: relative; z-index: 2; max-width: 1000px; width: 100%; margin: auto; }
        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #d946ef 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { font-size: clamp(1rem, 2vw, 1.2rem); color: #cbd5e1; font-weight: 300; margin-bottom: 25px; }
        
        .site-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-filter-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 9px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .tab-filter-btn:hover { background: rgba(51, 65, 85, 0.9); color: #fff; }
        .tab-filter-btn.active { background: #d946ef; color: #fff; border-color: #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.5); }

        .program-section { margin-bottom: 35px; text-align: left; }
        .program-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #818cf8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 320px));
            gap: 20px;
            justify-content: center;
        }
        .plan-card {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 22px;
            backdrop-filter: blur(6px);
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .plan-card:hover { transform: translateY(-3px); border-color: rgba(217, 70, 239, 0.4); }
        .plan-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 10px; color: #fff; }

        .plan-price { font-size: 1.45rem; color: #34d399; font-weight: bold; }
        .plan-discount { font-size: 0.95rem; color: #f472b6; text-decoration: line-through; margin-left: 8px; }
        
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            background: linear-gradient(135deg, #d946ef 0%, #818cf8 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: opacity 0.2s;
            width: 100%;
        }
        .download-btn:hover { opacity: 0.9; }

        .program-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .promo-tag {
            position: absolute;
            top: 15px; right: 15px;
            background: #f472b6; color: #0f1723;
            font-size: 10px; font-weight: bold;
            padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
        }
        .stock-tag {
            font-size: 11px;
            color: #f472b6;
            margin-top: 10px;
            font-weight: bold;
            display: block;
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            padding: 15px 0;
            width: 100%;
        }
        footer a { color: #818cf8; text-decoration: none; margin: 0 8px; }
        footer a:hover { text-decoration: underline; }

        /* Estilos do Sistema de Toast Notifications */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            min-width: 250px;
            padding: 12px 18px;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-info { border-left: 4px solid #818cf8; }
        .toast-success { border-left: 4px solid #34d399; }
        .toast-error { border-left: 4px solid #f472b6; }
    </style>
</head>
<body>

    <div class="hero">
        <div class="overlay"></div>
        <div class="content">
            <h1 id="siteTitle">Social Manager APP's - FusionGroup</h1>
            <p id="siteSubtitle">A carregar...</p>

            <div id="filterTabs" class="site-tabs" style="display: none;"></div>

            <div id="plansContainer"></div>
        </div>

        <footer id="siteFooter">
            <p>© 2026 FusionGroup. Todos os direitos reservados.</p>
            <div id="footerLinks" style="margin-top: 5px;"></div>
        </footer>
    </div>

    <!-- Container das Notificações Flutuantes -->
    <div id="toastContainer"></div>

    <script>
        const API_URL = 'https://scriptview.fusiongroup.pt/api/public-info';
        let cachedPlans = [];
        let cachedSettings = {};

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '⚠️';

            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 50);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function loadServerData() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                
                if (data.success) {
                    cachedSettings = data.settings || {};

                    if (cachedSettings.site_maintenance === 'true' || cachedSettings.site_maintenance === true) {
                        document.getElementById('siteTitle').innerText = "Projecto em Manutenção";
                        document.getElementById('siteSubtitle').innerText = "Aguardem Novidades";
                        document.getElementById('filterTabs').style.display = 'none';
                        document.getElementById('plansContainer').style.display = 'none';
                        showToast("O site encontra-se em manutenção temporária.", "info");
                        return;
                    }

                    document.getElementById('siteTitle').innerText = "Social Manager APP's - FusionGroup";
                    document.getElementById('siteSubtitle').innerText = "Planos & Promoções Oficiais";
                    
                    cachedPlans = data.plans || [];
                    
                    generateDynamicTabs(cachedPlans);
                    renderFooterPages(data.pages || []);
                    handleInitialHash();
                }
            } catch (error) {
                console.error("Erro ao ligar ao servidor:", error);
                document.getElementById('siteSubtitle').innerText = "Erro ao ligar ao servidor de gestão.";
                showToast("Erro de ligação ao servidor.", "error");
            }
        }

        function generateDynamicTabs(plans) {
            let tabsContainer = document.getElementById('filterTabs');
            tabsContainer.style.display = 'flex';
            
            let defaultPrograms = ['Gestor de Views', 'Social Media Manager', 'Lightburn Fusion'];
            let planPrograms = plans.map(p => p.program).filter(Boolean);
            let uniquePrograms = [...new Set([...defaultPrograms, ...planPrograms])];

            let html = `<button class="tab-filter-btn" data-type="all" onclick="filterPlans('all', event)">Todos os Planos</button>`;
            
            uniquePrograms.forEach(prog => {
                let icon = prog.toLowerCase().includes('social') ? '📱' : (prog.toLowerCase().includes('lightburn') ? '🔥' : '💻');
                html += `<button class="tab-filter-btn" data-type="${prog}" onclick="filterPlans('${prog}', event)">${icon} ${prog}</button>`;
            });

            html += `<button class="tab-filter-btn" data-type="promo" onclick="filterPlans('promo', event)">🔥 Promoções</button>`;
            html += `<button class="tab-filter-btn" data-type="downloads" onclick="filterPlans('downloads', event)">📥 Downloads</button>`;
            
            tabsContainer.innerHTML = html;
        }

        function renderFooterPages(pages) {
            let footerLinks = document.getElementById('footerLinks');
            let linksHtml = '';
            pages.forEach(page => {
                let fullUrl = page.url.startsWith('http') ? page.url : `https://scriptview.fusiongroup.pt${page.url}`;
                linksHtml += `<a href="${fullUrl}" target="_blank">${page.title}</a>`;
            });
            footerLinks.innerHTML = linksHtml;
        }

        function renderPlansGrouped(plansToRender) {
            let container = document.getElementById('plansContainer');
            container.style.display = 'block';
            container.innerHTML = '';

            if (plansToRender.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 20px;">Nenhum plano disponível de momento.</p>';
                return;
            }

            let groups = {};
            plansToRender.forEach(plan => {
                let prog = plan.program || 'Geral';
                if (!groups[prog]) groups[prog] = [];
                groups[prog].push(plan);
            });

            Object.keys(groups).forEach(progName => {
                let section = document.createElement('div');
                section.className = 'program-section';

                let icon = progName.toLowerCase().includes('social') ? '📱' : (progName.toLowerCase().includes('lightburn') ? '🔥' : '💻');
                section.innerHTML = `<div class="program-title"><span>${icon}</span> ${progName}</div>`;

                let grid = document.createElement('div');
                grid.className = 'plans-grid';

                groups[progName].forEach(plan => {
                    let card = document.createElement('div');
                    card.className = 'plan-card';
                    
                    let hasPromo = plan.discount && plan.discount.trim() !== "";
                    let promoTagHtml = hasPromo ? `<div class="promo-tag">Promoção</div>` : '';
                    
                    let priceHtml = `<span class="plan-price">${plan.price}</span>`;
                    if (hasPromo) {
                        priceHtml = `<span class="plan-price">${plan.discount}</span> <span class="plan-discount">${plan.price}</span>`;
                    }

                    let stockHtml = '';
                    if (plan.stock_limit !== null && plan.stock_limit !== undefined) {
                        let restantes = plan.stock_limit - (plan.sales_count || 0);
                        stockHtml = `<div class="stock-tag">🔥 Stock Limitado: ${restantes} / ${plan.stock_limit} disponíveis</div>`;
                    }

                    card.innerHTML = `
                        ${promoTagHtml}
                        <div class="plan-title">${plan.name}</div>
                        <div>${priceHtml}</div>
                        ${stockHtml}
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function renderDownloadsView() {
            let container = document.getElementById('plansContainer');
            container.style.display = 'block';
            container.innerHTML = '';

            let downloadPrograms = [
                { name: 'Gestor de Views', img: cachedSettings.logo_gestor_views, link: cachedSettings.download_gestor_views },
                { name: 'Social Media Manager', img: cachedSettings.logo_social_manager, link: cachedSettings.download_social_manager },
                { name: 'Lightburn Fusion', img: cachedSettings.logo_lightburn_fusion, link: cachedSettings.download_lightburn_fusion }
            ].filter(p => p.link && p.link.trim() !== '');

            if (downloadPrograms.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 20px;">Nenhum link de download configurado no servidor.</p>';
                return;
            }

            let section = document.createElement('div');
            section.className = 'program-section';
            section.innerHTML = `<div class="program-title"><span>📥</span> Central de Downloads</div>`;

            let grid = document.createElement('div');
            grid.className = 'plans-grid';

            downloadPrograms.forEach(prog => {
                let card = document.createElement('div');
                card.className = 'plan-card';

                let imgHtml = (prog.img && prog.img.trim() !== "") ? `<img src="${prog.img}" alt="${prog.name}" class="program-logo">` : '';

                card.innerHTML = `
                    ${imgHtml}
                    <div class="plan-title">${prog.name}</div>
                    <p style="font-size: 13px; color: #94a3b8; margin: 5px 0 15px 0;">Versão mais recente disponível</p>
                    <a href="${prog.link}" class="download-btn" target="_blank">📥 Descarregar Software</a>
                `;
                grid.appendChild(card);
            });

            section.appendChild(grid);
            container.appendChild(section);
        }

        function filterPlans(type, event, updateHistory = true) {
            document.querySelectorAll('.tab-filter-btn').forEach(btn => btn.classList.remove('active'));
            
            let targetBtn = document.querySelector(`.tab-filter-btn[data-type="${type}"]`);
            if (targetBtn) {
                targetBtn.classList.add('active');
            } else if (event && event.target) {
                event.target.classList.add('active');
            }

            if (updateHistory) {
                if (type === 'all') {
                    history.pushState(null, '', window.location.pathname);
                } else {
                    let slug = type.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                    history.pushState(null, '', `#${slug}`);
                }
            }

            if (type === 'all') {
                renderPlansGrouped(cachedPlans);
            } else if (type === 'promo') {
                let filtered = cachedPlans.filter(p => p.discount && p.discount.trim() !== "");
                renderPlansGrouped(filtered);
            } else if (type === 'downloads') {
                renderDownloadsView();
            } else {
                let filtered = cachedPlans.filter(p => (p.program || '').toLowerCase() === type.toLowerCase());
                renderPlansGrouped(filtered);
            }
        }

        function handleInitialHash() {
            let hash = window.location.hash.replace('#', '').trim();
            if (!hash) {
                filterPlans('all', null, false);
                return;
            }

            let foundType = 'all';
            let buttons = document.querySelectorAll('.tab-filter-btn');
            
            buttons.forEach(btn => {
                let dtype = btn.getAttribute('data-type');
                let dslug = dtype.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                if (dslug === hash) {
                    foundType = dtype;
                }
            });

            filterPlans(foundType, null, false);
        }

        window.addEventListener('popstate', function() {
            handleInitialHash();
        });

        loadServerData();
    </script>
</body>
</html>
